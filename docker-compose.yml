version: "3.9"

# NOSIH Protocol — local development / single-host deployment stack.
# Start everything:  docker compose up --build
# Gateway only:      docker compose up gateway postgres redis

services:

  # ── NOSIH Policy Gateway ────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: apps/gateway-server/Dockerfile
    ports:
      - "3100:3100"
    environment:
      NOSIH_PORT: "${NOSIH_PORT:-3100}"
      NOSIH_STORE: "${NOSIH_STORE:-postgres}"
      NOSIH_CACHE: "${NOSIH_CACHE:-redis}"
      # Legacy credentials are retained to preserve the existing pgdata volume.
      DATABASE_URL: "${DATABASE_URL:-postgresql://sint:sint@postgres:5432/sint}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      NOSIH_LOG_LEVEL: "${NOSIH_LOG_LEVEL:-info}"
      NOSIH_ENV: "${NOSIH_ENV:-development}"
      NOSIH_API_KEY: "${NOSIH_API_KEY:-nosih-dev-key}"
      # NOSIH_MAX_TIER: T3_COMMIT
      # NOSIH_REQUIRE_SIGNATURES: "false"
      # NOSIH_RATE_LIMIT: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # ── NOSIH Dashboard (React SPA via nginx) ───────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3201:3201"
    environment:
      # VITE_GATEWAY_URL is baked at build time (ARG); set it as a build-arg
      # if you need a custom public URL:
      #   docker compose build --build-arg VITE_GATEWAY_URL=https://gateway.example.com dashboard
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:3100   # kept for compatibility
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3201/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ── NOSIH Operator Interface (Voice HUD via nginx) ─────────────────────────
  nosih-interface:
    build:
      context: .
      dockerfile: apps/nosih-interface/Dockerfile
    ports:
      - "3202:3202"
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:3100
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3202/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      # Must match the credentials used when the persistent volume was created.
      POSTGRES_USER: sint
      POSTGRES_PASSWORD: sint
      POSTGRES_DB: sint
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run SQL migrations on first start
      - ./packages/persistence/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sint -d sint"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
