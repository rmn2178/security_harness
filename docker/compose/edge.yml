version: "3.9"

services:
  gateway:
    build:
      context: ../..
      dockerfile: apps/gateway-server/Dockerfile
    ports:
      - "3100:3100"
    environment:
      NOSIH_PORT: "3100"
      NOSIH_STORE: postgres
      NOSIH_CACHE: redis
      DATABASE_URL: postgresql://nosih:${POSTGRES_PASSWORD:-nosih}@postgres:5432/nosih
      REDIS_URL: redis://redis:6379
      NOSIH_LOG_LEVEL: info
      NOSIH_API_KEY: ${NOSIH_API_KEY:-edge-dev-key}
      NOSIH_REQUIRE_SIGNATURES: ${NOSIH_REQUIRE_SIGNATURES:-true}
      NOSIH_WS_ALLOW_QUERY_API_KEY: ${NOSIH_WS_ALLOW_QUERY_API_KEY:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nosih
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosih}
      POSTGRES_DB: nosih
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../packages/persistence/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nosih -d nosih"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
